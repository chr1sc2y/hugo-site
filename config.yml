baseURL: 'https://prov1dence.top/'
languageCode: 'en-us'
title: 'Zhengyu Chen'
theme: "PaperMod"

pagination:
  pagerSize: 5

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  title: 'Zhengyu Chen'
  description: "Zhengyu Chen — software engineer writing about AI agents, distributed systems, and developer infrastructure."
  keywords: [AI Agents, Distributed Systems, Developer Infrastructure, Software Engineering]
  author: "Zhengyu Chen"
  # author: ["Me", "You"] # multiple authors
  # images: ["<link or path of image for opengraph, twitter-cards>"]
  DateFormat: "January 2, 2006"
  defaultTheme: auto # dark, light
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: true

  label:
    text: "Zhengyu Chen"
    # icon: /apple-touch-icon.png
    iconHeight: 35

  # profile-mode
  profileMode:
    enabled: true # needs to be explicitly set
    title: 'Zhengyu Chen'
    subtitle: "Software engineer writing about reliable AI agents, distributed systems, and developer infrastructure."
    # imageUrl: "<img location>"
    # imageWidth: 120
    # imageHeight: 120
    # imageTitle: my image
    buttons:
      - name: Writing
        url: posts
      - name: About
        url: about

  # home-info mode
  homeInfoParams:
    Title: ""
    Content: ""

  socialIcons:
    - name: github
      url: "https://github.com/chr1sc2y"
    - name: LinkedIn
      url: "https://www.linkedin.com/in/chr1sc2y/"

  cover:
    hidden: true # hide everywhere but not in structured data
    hiddenInList: true # hide on list pages and home
    hiddenInSingle: true # hide on single page

  # editPost:
    # URL: "https://github.com/<path_to_repo>/content"
    # Text: "Suggest Changes" # edit text
    # appendFilePath: true # to append file path to Edit link

  # for search
  # https://fusejs.io/api/options.html
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

menu:
  main:
    - identifier: posts
      name: Writing
      url: /posts/
      weight: 10
    - identifier: about
      name: About
      url: /about/
      weight: 20
outputs:
    home:
        - HTML
        - RSS
        - JSON # is necessary
# Read: https://github.com/adityatelange/hugo-PaperMod/wiki/FAQs#using-hugos-syntax-highlighter-chroma
# pygmentsUseClasses: true
markup:
  goldmark:
    renderer:
      unsafe: true
ignoreLogs:
  - "warning-goldmark-raw-html"
